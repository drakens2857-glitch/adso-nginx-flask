services:
  nginx:
    image: nginx:alpine
    container_name: proxy-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-backend
    networks:
      - red-cba

  servidor-bd:
    image: mysql:8.0
    container_name: servidor-bd
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: adso_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - red-cba

  app-backend:
    build: .
    container_name: app-backend
    volumes:
      - .:/home/myapp
    environment:
      FLASK_ENV: development
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: adso_db
    depends_on:
      - servidor-bd
    networks:
      - red-cba

networks:
  red-cba:

volumes:
  mysql-data: