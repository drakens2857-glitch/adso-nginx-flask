services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: proxy-manager
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"

    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt 
    depends_on:
      - app-backend
    networks:
      - red-cba

  servidor-bd:
    image: mysql:8.0
    container_name: servidor-bd
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: adso_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - red-cba

  app-backend:
    image: frankynvillalba/adso-nginx-flask:v2.0
    container_name: app-backend
    environment:
      FLASK_ENV: development
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: adso_db
    depends_on:
      - servidor-bd
    networks:
      - red-cba

networks:
  red-cba:

volumes:
  mysql-data: