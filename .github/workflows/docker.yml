name: Publicar Imagen en Docker Hub y Desplegar

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Job 1: Pruebas unitarias y análisis de seguridad
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest bandit

      - name: Escaneo de seguridad (bandit)
        run: bandit -r . -x ./venv -s B101

      - name: Ejecutar pruebas pytest
        run: pytest

  # Job 2: Construcción, análisis de contenedor con Trivy y despliegue
  build-and-deploy:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen localmente
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          no-cache: true
          tags: nicobell182857/adso-nginx-flask:latest

      - name: Escanear contenedor con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nicobell182857/adso-nginx-flask:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Subir la imagen a Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: nicobell182857/adso-nginx-flask:latest

      - name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/labs/proyecto/tempdir
            docker compose pull app-backend
            docker compose up -d